spec_version: 1
name: clip_quality_env
type: space
runtime: fastapi
app: server.app:app
port: 8000
description: >
  CLIP Quality Analyzer environment with OpenEnv reference structure for
  clip-case review, quality-rule refinement, and deterministic scoring.
tasks:
  - task_easy
  - task_medium
  - task_hard
  - task_mixed
grader:
  endpoint: /grader
  deterministic: true
  score_range: [0.0, 1.0]
baseline:
  script: inference.py
  command: "PYTHONPATH=. python inference.py"
  expected_scores:
    task_easy: 0.7805
    task_medium: 0.7545
    task_hard: 0.5996
    task_mixed: 0.6793
tags:
  - openenv
  - reinforcement-learning
  - clip-quality
  - quality-analysis
  - clip-review
  - hackathon-2026
